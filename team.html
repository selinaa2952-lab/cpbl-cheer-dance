<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>球隊應援舞 | 中職應援舞教室</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 導覽列 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top border-bottom border-secondary border-opacity-25">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-arrow-left text-secondary"></i>
        <span>中職應援舞教室</span>
      </a>
      <div class="ms-auto">
        <a href="index.html#my-favorites" class="btn btn-outline-light btn-sm rounded-pill px-3">
          <i class="bi bi-heart-fill text-danger me-1"></i> 我的清單
        </a>
      </div>
    </div>
  </nav>

  <!-- 球隊 Header -->
  <header id="team-header" class="py-5 text-center border-bottom border-secondary border-opacity-25">
    <div class="container">
      <div id="team-badge-tag" class="badge px-3 py-1 rounded-pill mb-2">TEAM</div>
      <h1 id="team-name" class="display-5 fw-bold mb-1">載入中...</h1>
      <p id="team-en-name" class="lead text-secondary mb-2">-</p>
      <p id="team-cheer-leader" class="text-muted small mb-0">-</p>
    </div>
  </header>

  <main class="container py-4">
    <!-- 分類過濾 Filter -->
    <div class="d-flex flex-wrap justify-content-center mb-4" id="category-filters">
      <button class="filter-btn active" data-filter="全部">全部</button>
      <button class="filter-btn" data-filter="2026最新">2026 最新</button>
      <button class="filter-btn" data-filter="年度主題">年度主題</button>
      <button class="filter-btn" data-filter="球隊應援">球隊應援</button>
      <button class="filter-btn" data-filter="攻擊應援">攻擊應援</button>
      <button class="filter-btn" data-filter="勝利應援">勝利應援</button>
      <button class="filter-btn" data-filter="經典">經典</button>
    </div>

    <!-- 歌曲卡片列表 (3欄/2欄/1欄 RWD) -->
    <div id="team-songs-grid" class="row g-4">
      <!-- JS 動態產生 -->
    </div>
  </main>

  <footer class="bg-dark text-secondary py-4 text-center border-top border-secondary border-opacity-25 mt-auto">
    <div class="container">
      <p class="small mb-0">CPBL Cheer Dance Studio © 2026</p>
    </div>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/team.js"></script>
</body>
</html>
