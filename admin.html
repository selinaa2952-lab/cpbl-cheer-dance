<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPBL 應援曲管理後台</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 960px; margin: 0 auto; }
    .card { background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 24px; }
    h1, h2 { color: #1e293b; margin-top: 0; }
    .form-group { margin-bottom: 16px; position: relative; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #475569; }
    input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
    .hint-text { font-size: 13px; color: #64748b; margin-top: 4px; }
    .loading-badge { display: none; font-size: 12px; color: #2563eb; font-weight: 600; margin-left: 8px; }
    
    .btn { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 500; transition: all 0.2s; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    .btn-warning { background: #f59e0b; color: white; }
    .btn-warning:hover { background: #d97706; }
    .btn-warning.active { background: #b45309; outline: 2px solid #f59e0b; }
    .btn-edit { background: #f59e0b; padding: 6px 12px; font-size: 13px; margin-right: 6px; }
    .btn-edit:hover { background: #d97706; }
    .btn-danger { background: #ef4444; padding: 6px 12px; font-size: 13px; }
    .btn-danger:hover { background: #dc2626; }
    .nav-link { display: inline-block; margin-bottom: 16px; color: #2563eb; text-decoration: none; font-weight: 600; }
    
    /* 篩選與管理工具列 */
    .action-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .filter-panel { display: flex; flex-wrap: wrap; gap: 12px; background: #f8fafc; padding: 14px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #e2e8f0; align-items: center; }
    .filter-panel input, .filter-panel select { width: auto; min-width: 180px; flex: 1; }
    .filter-status { font-size: 14px; color: #64748b; margin-bottom: 12px; display: flex; justify-content: space-between; }

    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; font-size: 14px; }
    th { background: #f8fafc; color: #475569; }
    tr.duplicate-row { background-color: #fef2f2; }
    .dup-tag { background: #fee2e2; color: #dc2626; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-left: 6px; }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="nav-link">← 返回前台首頁</a>
  
  <div class="card">
    <h2 id="formTitle">🎵 新增應援歌曲 / 影片</h2>
    <form id="songForm">
      <input type="hidden" id="editSongId" value="">

      <div class="form-group">
        <label for="videoUrl">
          YouTube 影片網址
          <span id="fetchLoading" class="loading-badge">⏳ 正在抓取影片標題...</span>
        </label>
        <input type="url" id="videoUrl" placeholder="貼上網址即自動解析標題（支援一般網址、短網址與 Shorts）" required>
        <div class="hint-text">💡 貼上連結後，系統將自動擷取並填入下方歌曲名稱與姓名。</div>
      </div>

      <div class="form-group">
        <label for="title">歌曲 / 應援曲名稱</label>
        <input type="text" id="title" placeholder="例如：嗆司曲 - 登峰造極 / 選手應援曲" required>
      </div>

      <div class="form-group">
        <label for="team">所屬球隊</label>
        <select id="team" required>
          <option value="中信兄弟">中信兄弟</option>
          <option value="統一7-ELEVEn獅">統一7-ELEVEn獅</option>
          <option value="樂天桃猿">樂天桃猿</option>
          <option value="味全龍">味全龍</option>
          <option value="富邦悍將">富邦悍將</option>
          <option value="台鋼雄鷹">台鋼雄鷹</option>
        </select>
      </div>

      <div class="form-group">
        <label for="player">球員 / 啦啦隊員姓名（選填）</label>
        <input type="text" id="player" placeholder="例如：王威晨 / 峮峮">
      </div>

      <button type="submit" id="submitBtn" class="btn">新增並儲存</button>
      <button type="button" id="cancelEditBtn" class="btn btn-secondary" style="display: none;" onclick="cancelEdit()">取消編輯</button>
    </form>
  </div>

  <div class="card">
    <h2>📋 現有歌曲清單管理</h2>
    
    <div class="action-bar">
      <button class="btn btn-secondary" onclick="exportJSON()">📥 匯出 songs.json (準備發布 GitHub)</button>
      <button class="btn btn-warning" id="dupFilterBtn" onclick="toggleDuplicateFilter()">⚠️ 僅顯示重複項目</button>
      <button class="btn btn-secondary" onclick="resetDefault()">🔄 重設為預設清單</button>
    </div>

    <!-- 篩選與搜尋工具列 -->
    <div class="filter-panel">
      <input type="text" id="adminSearch" placeholder="🔍 搜尋曲名、球員..." oninput="renderTable()">
      <select id="adminTeamFilter" onchange="renderTable()">
        <option value="ALL">全部球隊</option>
        <option value="中信兄弟">中信兄弟</option>
        <option value="統一7-ELEVEn獅">統一7-ELEVEn獅</option>
        <option value="樂天桃猿">樂天桃猿</option>
        <option value="味全龍">味全龍</option>
        <option value="富邦悍將">富邦悍將</option>
        <option value="台鋼雄鷹">台鋼雄鷹</option>
      </select>
    </div>

    <div class="filter-status">
      <span id="filterStats">正在計算歌曲數量...</span>
    </div>
    
    <table>
      <thead>
        <tr>
          <th>名稱</th>
          <th>球隊</th>
          <th>球員/對象</th>
          <th>影片連結</th>
          <th style="width: 140px;">操作</th>
        </tr>
      </thead>
      <tbody id="songTableBody"></tbody>
    </table>
  </div>
</div>

<script>
  const STORAGE_KEY = 'cpbl_cheer_songs';
  let onlyShowDuplicates = false;

  const DEFAULT_SONGS = [
    {
      id: "1",
      title: "兄弟精神",
      team: "中信兄弟",
      player: "全隊",
      videoUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ"
    }
  ];

  function formatYoutubeUrl(url) {
    if (!url) return '';
    const trimmed = url.trim();
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = trimmed.match(regExp);
    return (match && match[2].length === 11)
      ? `https://www.youtube.com/embed/${match[2]}`
      : trimmed;
  }

  async function autoFetchVideoInfo(url) {
    const trimmed = url.trim();
    if (!trimmed.includes('youtube.com') && !trimmed.includes('youtu.be')) return;

    const loadingBadge = document.getElementById('fetchLoading');
    loadingBadge.style.display = 'inline';

    try {
      const res = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(trimmed)}`);
      const data = await res.json();

      if (data && data.title) {
        const fullTitle = data.title;
        const titleInput = document.getElementById('title');
        if (!titleInput.value) titleInput.value = fullTitle;

        const teamSelect = document.getElementById('team');
        if (fullTitle.includes('兄弟') || fullTitle.includes('中信')) teamSelect.value = '中信兄弟';
        else if (fullTitle.includes('統一') || fullTitle.includes('獅')) teamSelect.value = '統一7-ELEVEn獅';
        else if (fullTitle.includes('桃猿') || fullTitle.includes('樂天') || fullTitle.includes('Rakuten')) teamSelect.value = '樂天桃猿';
        else if (fullTitle.includes('味全') || fullTitle.includes('龍')) teamSelect.value = '味全龍';
        else if (fullTitle.includes('富邦') || fullTitle.includes('悍將') || fullTitle.includes('Fubon')) teamSelect.value = '富邦悍將';
        else if (fullTitle.includes('台鋼') || fullTitle.includes('雄鷹') || fullTitle.includes('Hawks')) teamSelect.value = '台鋼雄鷹';

        const playerInput = document.getElementById('player');
        if (!playerInput.value) {
          const bracketMatch = fullTitle.match(/[【\[]([^】\]]+)[】\]]/);
          if (bracketMatch) {
            playerInput.value = bracketMatch[1].trim();
          } else {
            const keywordMatch = fullTitle.match(/([^\s]+)\s*(個人應援曲|應援曲|嗆司曲|加油歌)/);
            if (keywordMatch) {
              playerInput.value = keywordMatch[1].replace(/中職|CPBL|202[0-9]|年度/g, '').trim();
            }
          }
        }
      }
    } catch (err) {
      console.warn('自動解析標題失敗:', err);
    } finally {
      loadingBadge.style.display = 'none';
    }
  }

  const videoInput = document.getElementById('videoUrl');
  videoInput.addEventListener('paste', () => setTimeout(() => autoFetchVideoInfo(videoInput.value), 100));
  videoInput.addEventListener('change', () => autoFetchVideoInfo(videoInput.value));

  function getSongs() {
    const data = localStorage.getItem(STORAGE_KEY);
    return data ? JSON.parse(data) : DEFAULT_SONGS;
  }

  function saveSongs(songs) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(songs));
    renderTable();
  }

  // 標記並篩選重複項目（判斷：曲名相同、或影片網址相同）
  function findDuplicates(songs) {
    const titleMap = {};
    const urlMap = {};
    const duplicateIds = new Set();

    songs.forEach(song => {
      const cleanTitle = song.title.trim().toLowerCase();
      const cleanUrl = song.videoUrl.trim().toLowerCase();

      if (titleMap[cleanTitle]) {
        duplicateIds.add(song.id);
        duplicateIds.add(titleMap[cleanTitle]);
      } else {
        titleMap[cleanTitle] = song.id;
      }

      if (urlMap[cleanUrl]) {
        duplicateIds.add(song.id);
        duplicateIds.add(urlMap[cleanUrl]);
      } else {
        urlMap[cleanUrl] = song.id;
      }
    });

    return duplicateIds;
  }

  function toggleDuplicateFilter() {
    onlyShowDuplicates = !onlyShowDuplicates;
    const btn = document.getElementById('dupFilterBtn');
    if (onlyShowDuplicates) {
      btn.classList.add('active');
      btn.innerText = '顯示全部項目';
    } else {
      btn.classList.remove('active');
      btn.innerText = '⚠️ 僅顯示重複項目';
    }
    renderTable();
  }

  function renderTable() {
    const songs = getSongs();
    const duplicateIds = findDuplicates(songs);
    const search = document.getElementById('adminSearch').value.toLowerCase().trim();
    const team = document.getElementById('adminTeamFilter').value;

    let filtered = songs.filter(song => {
      const matchTeam = (team === 'ALL') || (song.team === team);
      const matchSearch = !search || 
        song.title.toLowerCase().includes(search) || 
        (song.player && song.player.toLowerCase().includes(search));
      const matchDup = !onlyShowDuplicates || duplicateIds.has(song.id);

      return matchTeam && matchSearch && matchDup;
    });

    document.getElementById('filterStats').innerText = 
      `顯示 ${filtered.length} / 共 ${songs.length} 首應援曲 (重複項目: ${duplicateIds.size} 筆)`;

    const tbody = document.getElementById('songTableBody');
    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#94a3b8;padding:24px;">無符合條件的歌曲資料</td></tr>';
      return;
    }

    tbody.innerHTML = filtered.map(song => {
      const isDup = duplicateIds.has(song.id);
      return `
        <tr class="${isDup ? 'duplicate-row' : ''}">
          <td>
            <strong>${song.title}</strong>
            ${isDup ? '<span class="dup-tag">可能重複</span>' : ''}
          </td>
          <td>${song.team}</td>
          <td>${song.player || '-'}</td>
          <td><a href="${song.videoUrl}" target="_blank" style="color:#2563eb;">預覽連結</a></td>
          <td>
            <button class="btn btn-edit" onclick="startEdit('${song.id}')">編輯</button>
            <button class="btn btn-danger" onclick="deleteSong('${song.id}')">刪除</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  function startEdit(id) {
    const songs = getSongs();
    const song = songs.find(s => s.id === id);
    if (!song) return;

    document.getElementById('editSongId').value = song.id;
    document.getElementById('title').value = song.title;
    document.getElementById('team').value = song.team;
    document.getElementById('player').value = song.player || '';
    document.getElementById('videoUrl').value = song.videoUrl;

    document.getElementById('formTitle').innerText = '✏️ 編輯應援曲資料';
    document.getElementById('submitBtn').innerText = '儲存修改';
    document.getElementById('cancelEditBtn').style.display = 'inline-block';

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEdit() {
    document.getElementById('songForm').reset();
    document.getElementById('editSongId').value = '';
    document.getElementById('formTitle').innerText = '🎵 新增應援歌曲 / 影片';
    document.getElementById('submitBtn').innerText = '新增並儲存';
    document.getElementById('cancelEditBtn').style.display = 'none';
  }

  document.getElementById('songForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const editId = document.getElementById('editSongId').value;
    const rawUrl = document.getElementById('videoUrl').value;
    const embedUrl = formatYoutubeUrl(rawUrl);

    let songs = getSongs();

    if (editId) {
      songs = songs.map(song => {
        if (song.id === editId) {
          return {
            ...song,
            title: document.getElementById('title').value.trim(),
            team: document.getElementById('team').value,
            player: document.getElementById('player').value.trim(),
            videoUrl: embedUrl
          };
        }
        return song;
      });
      alert('✅ 修改已儲存！');
    } else {
      const newSong = {
        id: Date.now().toString(),
        title: document.getElementById('title').value.trim(),
        team: document.getElementById('team').value,
        player: document.getElementById('player').value.trim(),
        videoUrl: embedUrl
      };
      songs.unshift(newSong);
      alert('🎉 新增成功！');
    }

    saveSongs(songs);
    cancelEdit();
  });

  function deleteSong(id) {
    if (confirm('確定要刪除這首歌曲嗎？')) {
      const songs = getSongs().filter(s => s.id !== id);
      saveSongs(songs);
      if (document.getElementById('editSongId').value === id) {
        cancelEdit();
      }
    }
  }

  function exportJSON() {
    const songs = getSongs();
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(songs, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "songs.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  }

  function resetDefault() {
    if (confirm('確定要重設為預設資料嗎？這將覆蓋現有新增的內容。')) {
      saveSongs(DEFAULT_SONGS);
      cancelEdit();
    }
  }

  document.addEventListener('DOMContentLoaded', renderTable);
</script>

</body>
</html>
