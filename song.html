<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>應援曲教學播放 | 中職應援舞教室</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 導覽列 -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top border-bottom border-secondary border-opacity-25">
    <div class="container">
      <a id="back-link" class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-arrow-left"></i>
        <span id="nav-title">返回列表</span>
      </a>
      <div class="ms-auto">
        <a href="index.html#my-favorites" class="btn btn-outline-light btn-sm rounded-pill px-3">
          <i class="bi bi-heart-fill text-danger me-1"></i> 我的清單
        </a>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10">
        <!-- 16:9 YouTube 播放區域 -->
        <div id="video-container" class="video-responsive-wrapper shadow-lg mb-4">
          <!-- JS 依據 youtubeId 動態產生 iframe 或 待補佔位 -->
        </div>

        <!-- 歌曲詳情資訊卡 -->
        <div class="card bg-dark border-secondary border-opacity-25 p-4 rounded-4">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
            <div>
              <span id="song-team-badge" class="badge bg-primary me-2">球隊</span>
              <span id="song-type-badge" class="badge bg-secondary">類型</span>
              <h1 id="song-title" class="display-6 fw-bold mt-2 mb-0">載入中...</h1>
            </div>
            <button id="song-fav-btn" class="btn btn-favorite px-4 py-2">
              <i class="bi bi-heart"></i> 收藏此曲
            </button>
          </div>

          <hr class="border-secondary border-opacity-25">

          <div class="row g-3">
            <div class="col-6 col-md-3">
              <div class="text-secondary small">難易度</div>
              <div id="song-difficulty" class="star-rating">★★★☆☆</div>
            </div>
            <div class="col-6 col-md-3">
              <div class="text-secondary small">推出年份</div>
              <div id="song-year" class="fw-bold">2026</div>
            </div>
            <div class="col-12 col-md-6">
              <div class="text-secondary small">歌曲說明</div>
              <p id="song-desc" class="mb-0 text-light">-</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/song.js"></script>
</body>
</html>
