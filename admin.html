<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPBL 應援曲管理後台</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 960px; margin: 0 auto; }
    .card { background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 24px; }
    h1, h2 { color: #1e293b; margin-top: 0; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; color: #475569; }
    input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
    .hint-text { font-size: 13px; color: #64748b; margin-top: 4px; }
    .loading-badge { display: none; font-size: 12px; color: #2563eb; font-weight: 600; margin-left: 8px; }
    .btn { background: #2563eb; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: 500; }
    .btn:hover { background: #1d4ed8; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    .btn-warning { background: #f59e0b; color: white; }
    .btn-warning:hover { background: #d97706; }
    .btn-warning.active { background: #b45309; outline: 2px solid #f59e0b; }
    .nav-link { display: inline-block; margin-bottom: 16px; color: #2563eb; text-decoration: none; font-weight: 600; }
    .action-bar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .filter-panel { display: flex; flex-wrap: wrap; gap: 12px; background: #f8fafc; padding: 14px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #e2e8f0; align-items: center; }
    .filter-panel input, .filter-panel select { width: auto; min-width: 180px; flex: 1; }
    .filter-status { font-size: 14px; color: #64748b; margin-bottom: 12px; display: flex; justify-content: space-between; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; }
    th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: left; font-size: 14px; }
    th { background: #f8fafc; color: #475569; }
    tr.duplicate-row { background-color: #fef2f2; }
    .dup-tag { background: #fee2e2; color: #dc2626; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-left: 6px; }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="nav-link">← 返回前台首頁</a>
  
  <div class="card">
    <h2>🎵 上傳應援歌曲 / 影片至 Google 雲端</h2>
    <form id="songForm">
      <div class="form-group">
        <label for="videoUrl">
          YouTube 影片網址
          <span id="fetchLoading" class="loading-badge">⏳ 正在抓取影片標題...</span>
        </label>
        <input type="url" id="videoUrl" placeholder="貼上網址即自動解析標題（支援一般網址、短網址與 Shorts）" required>
        <div class="hint-text">💡 貼上連結後，系統將自動擷取並填入下方歌曲名稱與姓名。</div>
      </div>

      <div class="form-group">
        <label for="title">歌曲 / 應援曲名稱</label>
        <input type="text" id="title" placeholder="例如：嗆司曲 - 登峰造極 / 選手應援曲" required>
      </div>

      <div class="form-group">
        <label for="team">所屬球隊</label>
        <select id="team" required>
          <option value="中信兄弟">中信兄弟</option>
          <option value="統一7-ELEVEn獅">統一7-ELEVEn獅</option>
          <option value="樂天桃猿">樂天桃猿</option>
          <option value="味全龍">味全龍</option>
          <option value="富邦悍將">富邦悍將</option>
          <option value="台鋼雄鷹">台鋼雄鷹</option>
        </select>
      </div>

      <div class="form-group">
        <label for="player">球員 / 啦啦隊員姓名（選填）</label>
        <input type="text" id="player" placeholder="例如：王威晨 / 峮峮">
      </div>

      <button type="submit" id="submitBtn" class="btn">🚀 上傳至 Google 雲端資料庫</button>
    </form>
  </div>

  <div class="card">
    <h2>📋 雲端現有歌曲清單</h2>
    
    <div class="action-bar">
      <button class="btn btn-secondary" onclick="fetchCloudSongs()">🔄 重新整理雲端資料</button>
      <button class="btn btn-warning" id="dupFilterBtn" onclick="toggleDuplicateFilter()">⚠️ 僅顯示重複項目</button>
    </div>

    <div class="filter-panel">
      <input type="text" id="adminSearch" placeholder="🔍 搜尋曲名、球員..." oninput="renderTable()">
      <select id="adminTeamFilter" onchange="renderTable()">
        <option value="ALL">全部球隊</option>
        <option value="中信兄弟">中信兄弟</option>
        <option value="統一7-ELEVEn獅">統一7-ELEVEn獅</option>
        <option value="樂天桃猿">樂天桃猿</option>
        <option value="味全龍">味全龍</option>
        <option value="富邦悍將">富邦悍將</option>
        <option value="台鋼雄鷹">台鋼雄鷹</option>
      </select>
    </div>

    <div class="filter-status">
      <span id="filterStats">正在連線至 Google 試算表...</span>
    </div>
    
    <table>
      <thead>
        <tr>
          <th>名稱</th>
          <th>球隊</th>
          <th>球員/對象</th>
          <th>影片連結</th>
        </tr>
      </thead>
      <tbody id="songTableBody"></tbody>
    </table>
  </div>
</div>

<script>
  (function() {
    const API_ENDPOINT = "https://script.google.com/macros/library/d/1C3qgkMRELufHtCKWRCM4s5tcBgFtdU-G1ulHrVvI7gCkbYyIvdmjHjFX/1";
    let songsData = [];
    let showDupOnly = false;

    function formatYoutubeUrl(url) {
      if (!url) return '';
      const trimmed = url.trim();
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = trimmed.match(regExp);
      return (match && match[2].length === 11)
        ? `https://www.youtube.com/embed/${match[2]}`
        : trimmed;
    }

    async function autoFetchVideoInfo(url) {
      const trimmed = url.trim();
      if (!trimmed.includes('youtube.com') && !trimmed.includes('youtu.be')) return;

      const badge = document.getElementById('fetchLoading');
      if (badge) badge.style.display = 'inline';

      try {
        const res = await fetch(`https://noembed.com/embed?url=${encodeURIComponent(trimmed)}`);
        const data = await res.json();
        if (data && data.title) {
          const titleInput = document.getElementById('title');
          if (titleInput && !titleInput.value) titleInput.value = data.title;

          const teamSelect = document.getElementById('team');
          if (teamSelect) {
            if (data.title.includes('兄弟') || data.title.includes('中信')) teamSelect.value = '中信兄弟';
            else if (data.title.includes('統一') || data.title.includes('獅')) teamSelect.value = '統一7-ELEVEn獅';
            else if (data.title.includes('桃猿') || data.title.includes('樂天')) teamSelect.value = '樂天桃猿';
            else if (data.title.includes('味全') || data.title.includes('龍')) teamSelect.value = '味全龍';
            else if (data.title.includes('富邦') || data.title.includes('悍將')) teamSelect.value = '富邦悍將';
            else if (data.title.includes('台鋼') || data.title.includes('雄鷹')) teamSelect.value = '台鋼雄鷹';
          }

          const playerInput = document.getElementById('player');
          if (playerInput && !playerInput.value) {
            const match = data.title.match(/[【\[]([^】\]]+)[】\]]/);
            if (match) playerInput.value = match[1].trim();
          }
        }
      } catch (e) {
        console.warn('解析影片失敗:', e);
      } finally {
        if (badge) badge.style.display = 'none';
      }
    }

    const videoInput = document.getElementById('videoUrl');
    if (videoInput) {
      videoInput.addEventListener('paste', () => setTimeout(() => autoFetchVideoInfo(videoInput.value), 100));
      videoInput.addEventListener('change', () => autoFetchVideoInfo(videoInput.value));
    }

    window.fetchCloudSongs = async function() {
      const stats = document.getElementById('filterStats');
      if (stats) stats.innerText = "⏳ 正在從 Google 雲端載入清單...";
      try {
        const res = await fetch(API_ENDPOINT);
        const data = await res.json();
        songsData = Array.isArray(data) ? data : [];
        window.renderTable();
      } catch (err) {
        console.error("後台載入失敗:", err);
        if (stats) stats.innerText = "❌ 無法取得雲端清單，請按 F12 查看主控台。";
      }
    };

    window.toggleDuplicateFilter = function() {
      showDupOnly = !showDupOnly;
      const btn = document.getElementById('dupFilterBtn');
      if (btn) {
        btn.classList.toggle('active', showDupOnly);
        btn.innerText = showDupOnly ? '顯示全部項目' : '⚠️ 僅顯示重複項目';
      }
      window.renderTable();
    };

    window.renderTable = function() {
      const search = (document.getElementById('adminSearch')?.value || '').toLowerCase().trim();
      const team = document.getElementById('adminTeamFilter')?.value || 'ALL';

      const titleMap = {};
      const urlMap = {};
      const dupSet = new Set();

      songsData.forEach((s, idx) => {
        const t = (s.title || '').trim().toLowerCase();
        const u = (s.videoUrl || '').trim().toLowerCase();
        const id = s.id || `row_${idx}`;
        s._tempId = id;

        if (t) {
          if (titleMap[t]) { dupSet.add(id); dupSet.add(titleMap[t]); }
          else { titleMap[t] = id; }
        }
        if (u) {
          if (urlMap[u]) { dupSet.add(id); dupSet.add(urlMap[u]); }
          else { urlMap[u] = id; }
        }
      });

      const filtered = songsData.filter(s => {
        const matchTeam = (team === 'ALL') || (s.team === team);
        const matchSearch = !search || (s.title && s.title.toLowerCase().includes(search)) || (s.player && s.player.toLowerCase().includes(search));
        const matchDup = !showDupOnly || dupSet.has(s._tempId);
        return matchTeam && matchSearch && matchDup;
      });

      const stats = document.getElementById('filterStats');
      if (stats) stats.innerText = `顯示 ${filtered.length} / 共 ${songsData.length} 首應援曲 (重複項目: ${dupSet.size} 筆)`;

      const tbody = document.getElementById('songTableBody');
      if (!tbody) return;

      if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:#94a3b8;padding:24px;">無符合條件的歌曲資料</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map(s => {
        const isDup = dupSet.has(s._tempId);
        return `
          <tr class="${isDup ? 'duplicate-row' : ''}">
            <td><strong>${s.title}</strong>${isDup ? '<span class="dup-tag">可能重複</span>' : ''}</td>
            <td>${s.team}</td>
            <td>${s.player || '-'}</td>
            <td>${s.videoUrl ? `<a href="${s.videoUrl}" target="_blank" style="color:#2563eb;font-weight:600;">▶ 觀看影片</a>` : '<span style="color:#94a3b8;">無連結</span>'}</td>
          </tr>
        `;
      }).join('');
    };

    document.getElementById('songForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = "⏳ 上傳中，請稍候...";

      const newSong = {
        title: document.getElementById('title').value.trim(),
        team: document.getElementById('team').value,
        player: document.getElementById('player').value.trim(),
        videoUrl: formatYoutubeUrl(document.getElementById('videoUrl').value)
      };

      try {
        await fetch(API_ENDPOINT, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newSong)
        });
        alert('🎉 上傳成功！已即時寫入 Google 雲端試算表。');
        this.reset();
        setTimeout(window.fetchCloudSongs, 1500);
      } catch (err) {
        alert('❌ 上傳失敗，請檢查網路連線。');
        console.error(err);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "🚀 上傳至 Google 雲端資料庫";
      }
    });

    window.fetchCloudSongs();
  })();
</script>

</body>
</html>
