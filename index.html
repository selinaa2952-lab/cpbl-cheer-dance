<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPBL 中職應援曲庫</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #3b82f6;

      /* 中職六隊代表色 */
      --color-brothers: #f59e0b;  /* 中信兄弟 - 黃 */
      --color-lions: #f97316;     /* 統一獅 - 橘 */
      --color-monkeys: #991b1b;   /* 樂天桃猿 - 桃紅/酒紅 */
      --color-dragons: #dc2626;   /* 味全龍 - 烈焰紅 */
      --color-guardians: #0284c7; /* 富邦悍將 - 悍將藍 */
      --color-hawks: #059669;     /* 台鋼雄鷹 - 綠 */
    }

    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* 頂部導航列 */
    header {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .admin-btn {
      background: #334155;
      color: var(--text-main);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }

    .admin-btn:hover {
      background: var(--primary);
      transform: translateY(-1px);
    }

    /* 主視覺與控制區塊 */
    .hero-section {
      max-width: 1280px;
      margin: 0 auto;
      padding: 36px 24px 24px 24px;
    }

    .hero-title {
  font-size: 32px;
  font-weight: 800;
  margin: 0 0 8px 0;
  background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
  -webkit-background-clip: text;
  background-clip: text; /* 補上這一行標準屬性 */
  -webkit-text-fill-color: transparent;
}

    .hero-subtitle {
      color: var(--text-sub);
      font-size: 15px;
      margin: 0 0 24px 0;
    }

    /* 搜尋與篩選工具列 */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .search-bar {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-sub);
    }

    /* 球隊標籤篩選按鈕 */
    .filter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      background: #0f172a;
      color: var(--text-sub);
      border: 1px solid var(--card-border);
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover {
      color: var(--text-main);
      border-color: #64748b;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* 狀態提示列 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-sub);
    }

    /* 歌曲展示網格 */
    .content-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px 60px 24px;
    }

    .song-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
    }

    /* 歌曲卡片 */
    .song-card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .song-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.5);
      border-color: #475569;
    }

    /* 16:9 影片框架 */
    .video-frame {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background: #000;
    }

    .video-frame iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .card-info {
      padding: 18px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    /* 球隊專屬 Badge 色彩 */
    .team-badge {
      align-self: flex-start;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .team-brothers { background: rgba(245, 158, 11, 0.15); color: var(--color-brothers); border: 1px solid rgba(245, 158, 11, 0.3); }
    .team-lions { background: rgba(249, 115, 22, 0.15); color: var(--color-lions); border: 1px solid rgba(249, 115, 22, 0.3); }
    .team-monkeys { background: rgba(153, 27, 27, 0.2); color: #fca5a5; border: 1px solid rgba(153, 27, 27, 0.4); }
    .team-dragons { background: rgba(220, 38, 38, 0.15); color: #f87171; border: 1px solid rgba(220, 38, 38, 0.3); }
    .team-guardians { background: rgba(2, 132, 199, 0.15); color: var(--color-guardians); border: 1px solid rgba(2, 132, 199, 0.3); }
    .team-hawks { background: rgba(5, 150, 105, 0.15); color: var(--color-hawks); border: 1px solid rgba(5, 150, 105, 0.3); }
    .team-default { background: rgba(148, 163, 184, 0.15); color: var(--text-sub); border: 1px solid var(--card-border); }

    .song-name {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 6px 0;
      color: #ffffff;
      line-height: 1.4;
    }

    .target-name {
      font-size: 14px;
      color: var(--text-sub);
      margin: 0;
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .empty-container {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px dashed var(--card-border);
    }
    .empty-container p { color: var(--text-sub); margin: 0; }
  </style>
</head>
<body>

  <!-- 頂部導航 -->
  <header>
    <div class="nav-container">
      <div class="brand">⚾ CPBL Cheer Hub</div>
      <a href="admin.html" class="admin-btn">⚙️ 後台管理</a>
    </div>
  </header>

  <!-- 標題與搜尋篩選區 -->
  <section class="hero-section">
    <h1 class="hero-title">中職應援曲庫</h1>
    <p class="hero-subtitle">收錄中華職棒六隊最新應援曲、嗆司曲與啦啦隊舞蹈動作</p>

    <div class="controls">
      <!-- 關鍵字搜尋 -->
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="搜尋曲名、球員或啦啦隊員姓名..."
        >
      </div>

      <!-- 球隊分類按鈕 -->
      <div class="filter-tabs" id="filterTabs">
        <button class="tab-btn active" data-team="ALL">全部球隊</button>
        <button class="tab-btn" data-team="中信兄弟">中信兄弟</button>
        <button class="tab-btn" data-team="統一7-ELEVEn獅">統一7-ELEVEn獅</button>
        <button class="tab-btn" data-team="樂天桃猿">樂天桃猿</button>
        <button class="tab-btn" data-team="味全龍">味全龍</button>
        <button class="tab-btn" data-team="富邦悍將">富邦悍將</button>
        <button class="tab-btn" data-team="台鋼雄鷹">台鋼雄鷹</button>
      </div>
    </div>

    <!-- 即時統計 -->
    <div class="status-bar">
      <span id="resultCount">正在載入歌曲...</span>
    </div>
  </section>

  <!-- 卡片展示清單 -->
  <main class="content-container">
    <div class="song-grid" id="songGrid"></div>
  </main>

  <script>
    const STORAGE_KEY = 'cpbl_cheer_songs';
    let allSongs = [];
    let currentFilter = 'ALL';
    let currentSearch = '';

    // 隊伍 Badge 樣式對照表
    const teamStyleMap = {
      '中信兄弟': 'team-brothers',
      '統一7-ELEVEn獅': 'team-lions',
      '樂天桃猿': 'team-monkeys',
      '味全龍': 'team-dragons',
      '富邦悍將': 'team-guardians',
      '台鋼雄鷹': 'team-hawks'
    };

    // 載入資料
    function initData() {
      const localData = localStorage.getItem(STORAGE_KEY);
      if (localData) {
        allSongs = JSON.parse(localData);
        applyFilterAndRender();
      } else {
        fetch('./songs.json')
          .then(res => res.json())
          .then(data => {
            allSongs = data;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            applyFilterAndRender();
          })
          .catch(err => {
            console.warn('載入失敗或無初始檔案:', err);
            allSongs = [];
            applyFilterAndRender();
          });
      }
    }

    // 篩選與搜尋核心運算
    function applyFilterAndRender() {
      const filtered = allSongs.filter(song => {
        // 1. 隊伍篩選
        const matchTeam = (currentFilter === 'ALL') || (song.team === currentFilter);
        
        // 2. 關鍵字搜尋（比對曲名與球員）
        const query = currentSearch.toLowerCase().trim();
        const matchSearch = !query || 
          (song.title && song.title.toLowerCase().includes(query)) ||
          (song.player && song.player.toLowerCase().includes(query));

        return matchTeam && matchSearch;
      });

      renderGrid(filtered);
      updateStatus(filtered.length);
    }

    // 渲染卡片
    function renderGrid(songs) {
      const grid = document.getElementById('songGrid');

      if (songs.length === 0) {
        grid.innerHTML = `
          <div class="empty-container">
            <p>查無符合條件的應援曲 ⚾</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = songs.map(song => {
        const teamClass = teamStyleMap[song.team] || 'team-default';
        return `
          <div class="song-card">
            <div class="video-frame">
              <iframe 
                src="${song.videoUrl}" 
                title="${song.title}" 
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
              </iframe>
            </div>
            <div class="card-info">
              <span class="team-badge ${teamClass}">${song.team}</span>
              <h3 class="song-name">${song.title}</h3>
              <p class="target-name">👤 ${song.player || '全隊通用'}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateStatus(count) {
      const resultEl = document.getElementById('resultCount');
      resultEl.innerText = `顯示 ${count} 首應援曲（總共 ${allSongs.length} 首）`;
    }

    // 事件監聽：搜尋框輸入
    document.getElementById('searchInput').addEventListener('input', (e) => {
      currentSearch = e.target.value;
      applyFilterAndRender();
    });

    // 事件監聽：球隊標籤切換
    document.getElementById('filterTabs').addEventListener('click', (e) => {
      if (e.target.classList.contains('tab-btn')) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.team;
        applyFilterAndRender();
      }
    });

    document.addEventListener('DOMContentLoaded', initData);
  </script>
</body>
</html>
